<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Facebook Finance Dashboard{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --muted: #8a93a4;
      --accent: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      background: #14171d;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header .demo { background: var(--warn); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    header a { color: var(--muted); text-decoration: none; margin-left: auto; font-size: 13px; }
    header a:hover { color: var(--text); }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 28px; font-weight: 600; margin-top: 4px; }
    .stat-accent { color: var(--accent); }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 24px 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.title { max-width: 320px; }
    td a { color: var(--accent); text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #2a2f3a; color: var(--muted); }
    form .field { margin-bottom: 14px; }
    form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    form input { width: 100%; padding: 10px 12px; background: #0f1115; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
    form input:focus { outline: none; border-color: var(--accent); }
    button { background: var(--accent); color: #000; border: 0; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { filter: brightness(1.1); }
    .err { background: rgba(248, 113, 113, 0.12); border: 1px solid var(--err); color: var(--err); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
    .help { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .help code { background: #0f1115; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>Facebook Finance Dashboard</h1>
    {% if demo %}<span class="demo">DEMO</span>{% endif %}
    {% if not demo %}<a href="{{ url_for('logout') }}">Disconnect</a>{% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
